notes: >-
  Sapiom ships a TypeScript/JavaScript SDK family (the @sapiom npm org, monorepo at
  github.com/sapiom/sapiom-js). All packages below are first-party. Python support is
  documented as "Coming Soon". @sapiom/tools is the typed capability client (the same
  surface agents call as ctx.sapiom.*); @sapiom/cli and @sapiom/mcp are catalogued
  here as binaries but their command/tool surfaces live in cli/ and mcp/.
packages:
- language: javascript
  registry: npm
  name: "@sapiom/tools"
  url: https://www.npmjs.com/package/@sapiom/tools
  install: npm install @sapiom/tools
  official: true
  description: Typed client for Sapiom capabilities (sandboxes, repositories, agent, file storage, ...) — the same tools agents call over MCP, callable from your code.
- language: javascript
  registry: npm
  name: "@sapiom/core"
  url: https://www.npmjs.com/package/@sapiom/core
  install: npm install @sapiom/core
  official: true
  description: Core SDK for the Sapiom API — transaction management and core utilities.
