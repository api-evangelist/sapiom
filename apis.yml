name: Sapiom
description: >-
  Sapiom is an execution engine for AI agents that gives agents and code instant,
  pay-per-use access to a catalog of paid capabilities through a single API key and
  wallet — no per-vendor accounts. Capabilities include web search and scraping,
  access to 400+ AI models, image/video generation, audio/text-to-speech, browser
  automation, compute sandboxes, databases (Postgres/Redis/vector/search), messaging
  and queues, file storage, private git repositories, GitHub export, email enrichment,
  domains/DNS, and phone verification. It is reachable three ways: a typed SDK client
  (@sapiom/tools / ctx.sapiom.*), a hosted remote MCP server (~130 tools), and a REST
  API (https://api.sapiom.ai/v1) for transaction, agent, spending-rule, and analytics
  management. Metered access is authorized via an x402 (HTTP 402) payment flow with
  per-agent spend rules. Sapiom is backed by Accel.
